name: Publish Morning Edition
on:
  schedule:
    - cron: "35 4 * * *"
    - cron: "50 4 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: morning-edition
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ vars.BRIEFING_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BRIEFING_URL: ${{ vars.BRIEFING_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Request the Indian morning edition
        run: |
          test -n "$BRIEFING_URL" && test -n "$CRON_SECRET"
          curl --silent --show-error --fail-with-body --max-time 145 \
            --request POST --header "Authorization: Bearer $CRON_SECRET" \
            "${BRIEFING_URL%/}/api/refresh"
