# Every day the code chooses today's stocks and saves the data the writer needs.
# GitHub's timer is best-effort and can run hours late, so it fires twice early (07:37 and 08:47 IST) as a backup;
# the writer can also start this at once by saving drafts/<date>/request.json (see docs/chatgpt-daily.md).
name: Morning · prepare data
on:
  schedule:
    - cron: '7 2 * * *'
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths: ['drafts/**/request.json']
  workflow_dispatch:
    inputs:
      date: {description: 'Edition date (YYYY-MM-DD, IST). Blank = today.', required: false}
      dry_run: {description: 'Only print the result, commit nothing', type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: morning-edition, cancel-in-progress: false}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Prepare
        env: {DATE_INPUT: '${{ inputs.date }}'}
        run: |
          DATE="${DATE_INPUT:-$(TZ=Asia/Kolkata date +%F)}"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          REFRESH=$(node -e "const fs=require('fs');const p='drafts/'+process.argv[1]+'/request.json';const r=fs.existsSync(p)?JSON.parse(fs.readFileSync(p)):{};console.log(r.date===process.argv[1]&&r.replacePublished===true?'1':'0')" "$DATE")
          if [ -f "public/editions/$DATE.json" ] && [ "$REFRESH" != 1 ]; then echo "Edition $DATE already published"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          mkdir -p "drafts/$DATE"
          MORNING_PREPARE_STAGE=draft node scripts/prepare-v2.mjs "$DATE" > "drafts/$DATE/prepared.json"
          node -e "const p=require('./drafts/$DATE/prepared.json'); console.log('Stocks:', JSON.stringify(p.selection ?? p.fundamentalsUnavailable))"
      - name: Commit
        if: env.SKIP != '1' && inputs.dry_run != true
        env: {MESSAGE: 'Prepare Morning Edition data ${{ env.DATE }}'}
        run: scripts/ci-commit.sh "drafts/$DATE/prepared.json"
